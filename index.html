<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PTest</title>
</head>

<body>
  <h1>PTest</h1>

  <input
    id="domain"
    type="text"
    placeholder="example.com"
    style="width:300px;"
  >

  <button onclick="proxy()">Go</button>

  <pre id="output"></pre>

  <script>
    async function proxy() {
      const input = document.getElementById("domain").value.trim();
      const output = document.getElementById("output");

      if (!input) {
        output.textContent = "Enter a domain first.";
        return;
      }

      const url = input.startsWith("http://") || input.startsWith("https://")
        ? input
        : "https://" + input;

      output.textContent = "Requesting: " + url + "\n";

      try {
        const response = await fetch(url);

        output.textContent +=
          "Response received: HTTP " + response.status + "\n\n" +
          await response.text();

      } catch (error) {
        output.textContent +=
          "Request failed:\n" + error;
      }
    }
  </script>
</body>
</html>
