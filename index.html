<!DOCTYPE html>
<html>
<head>
    <title>PTest</title>
</head>
<body>

<h1>PTest</h1>

<input id="site" type="text" placeholder="Enter a domain">

<button onclick="showSite()">Go</button>

<p id="output"></p>

<script>
function showSite() {
    const site = document.getElementById("site").value;

    document.getElementById("output").textContent =
        "You entered: " + site;
}
</script>

</body>
</html>
